name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # There is no automated test suite yet, so CI proves the app compiles on
      # Java 17 (the NetBeans project's target) and packages a runnable jar.
      - name: Compile
        run: javac -encoding UTF-8 --release 17 -d build/classes src/*.java

      - name: Package
        run: jar --create --file build/internship-management-system.jar --main-class InternshipUser -C build/classes .

      - uses: actions/upload-artifact@v4
        with:
          name: internship-management-system
          path: build/internship-management-system.jar
          retention-days: 14
